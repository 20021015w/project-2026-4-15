services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      # MYSQL_DATABASE: project_db # 可选，初始化自动创建库
      # MYSQL_USER: dev
      # MYSQL_PASSWORD: dev123
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
volumes:
  mysql-data:
